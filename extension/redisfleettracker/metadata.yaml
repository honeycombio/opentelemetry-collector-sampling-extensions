type: redis_fleet_tracker
display_name: Redis Fleet Tracker Extension
github_project: honeycombio/opentelemetry-collector-sampling-extensions

status:
  class: extension
  stability:
    development: [extension]
  distributions: []
  codeowners:
    active: [MikeGoldsmith]

tests:
  config:
    endpoint: "localhost:6379"

telemetry:
  metrics:
    extension_redis_fleet_tracker_heartbeat_failures:
      description: Number of heartbeat or observe errors.
      unit: "1"
      enabled: true
      stability: development
      sum:
        value_type: int
        monotonic: true
    extension_redis_fleet_tracker_member_count:
      description: Current live member count observed for the fleet.
      unit: "1"
      enabled: true
      stability: development
      gauge:
        value_type: int
