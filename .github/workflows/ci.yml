name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: extension/redisfleettracker/go.sum
      - name: gofmt and vet
        working-directory: extension/redisfleettracker
        run: |
          gofmt -l . | tee /dev/stderr | test -z "$(cat)"
          go vet ./...
      - name: test
        working-directory: extension/redisfleettracker
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: extension/redisfleettracker/go.mod
          cache-dependency-path: extension/redisfleettracker/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: extension/redisfleettracker

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: extension/redisfleettracker/go.mod
          cache-dependency-path: extension/redisfleettracker/go.sum
      - name: go generate and check for drift
        working-directory: extension/redisfleettracker
        run: |
          go generate ./...
          git diff --exit-code

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: extension/redisfleettracker/go.mod
          cache-dependency-path: extension/redisfleettracker/go.sum
      - name: integration test
        working-directory: extension/redisfleettracker
        run: go test -race -tags integration ./...
